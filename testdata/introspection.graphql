{
	__schema {
		queryType { name }
		types {
			name
			kind
			fields(includeDeprecated: true) {
				name
				args { name type { name kind ofType { name kind } } }
				type { name kind ofType { name kind ofType { name kind } } }
			}
			interfaces { name }
			possibleTypes { name }
			enumValues(includeDeprecated: true) { name }
			inputFields { name type { name kind } }
		}
	}
}
