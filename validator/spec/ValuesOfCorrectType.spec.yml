- name: Object value as a variable default for Int
  rule: ValuesOfCorrectType
  schema: 0
  query: |
    query ($v: Int = {}) {
      complicatedArgs {
        intArgField(intArg: $v)
      }
    }
  errors:
    - message: "Int cannot represent non-integer value: {}"
      locations:
        - {line: 1, column: 18}
