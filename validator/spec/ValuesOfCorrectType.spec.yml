- name: Object value for an Int argument
  rule: ValuesOfCorrectType
  schema: 0
  query: |
    {
      complicatedArgs {
        intArgField(intArg: {})
      }
    }
  errors:
    - message: "Int cannot represent non-integer value: {}"
      locations:
        - {line: 3, column: 25}
- name: Object value for a non-null Int argument
  rule: ValuesOfCorrectType
  schema: 0
  query: |
    {
      complicatedArgs {
        nonNullIntArgField(nonNullIntArg: {})
      }
    }
  errors:
    - message: "Int cannot represent non-integer value: {}"
      locations:
        - {line: 3, column: 39}
